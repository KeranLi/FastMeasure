# MobileSAM Rock Grain Auto Segmentation System Configuration

# ===== Model Path Configuration =====
model_paths:
  yolo: "./models/best_yolo_20260107.pt"
  mobilesam: "./models/mobile_sam.pt"
  device: "cpu"
  sam_type: "vit_t"

# ===== MobileSAM Engine Parameters =====
mobilesam_params:
  general:
    points_per_side: 32
    points_per_batch: 64
    pred_iou_thresh: 0.88
    stability_score_thresh: 0.95
    box_nms_thresh: 0.7
    crop_n_layers: 0
    crop_n_points_downscale_factor: 1
  grain_optimization:
    use_box_prompt: true
    use_center_point: true
    box_expansion: 1.15
    min_mask_confidence: 0.3
    min_mask_area: 10
    max_mask_area_ratio: 0.8
  multi_scale:
    enabled: true
    scales: [0.8, 1.0, 1.2]
    merge_strategy: "union"

# ===== Scale Bar Detection Configuration =====
scale_detection:
  enabled: true
  known_length_um: 1000.0
  detection_params:
    red_lower1: [0, 120, 120]
    red_upper1: [10, 255, 255]
    red_lower2: [160, 120, 120]
    red_upper2: [180, 255, 255]
    crop_height: 220
    crop_width: 600
    search_margin: 80
    min_aspect_ratio: 8
    min_horizontal_score: 0.6

# ===== Processing Parameters =====
processing:
  yolo_confidence: 0.15
  min_area: 30
  min_bbox_area: 15
  remove_edge_grains: false
  plot_results: true
  performance_monitoring: true

# ===== Output Configuration =====
output:
  root_dir: "results"
  mode_subdir: "mobilesam"
  type_subdir: "auto"
  create_subdirs: true
  save_visualization: true
  save_mask: true
  save_statistics: true
  save_summary: true
  save_performance: true
  save_debug_info: false

# ===== Batch Processing =====
batch_processing:
  supported_formats: [".tif", ".tiff", ".jpg", ".jpeg", ".png", ".bmp"]
  skip_corrupted: true
  max_workers: 1
  log_errors: true

# ===== Logging =====
logging:
  level: "INFO"
  save_to_file: true
  show_in_console: true
  log_format: "%(asctime)s - %(levelname)s - %(message)s"
  log_subdir: "mobilesam"

# ===== Grain Labeling =====
grain_labeling:
  enabled: true
  font_size: 11
  text_color: "yellow"
  bg_color: ""
  show_area: true
  max_labels: 1000
  min_area: 0
  text_outline: true
  outline_color: "black"
  outline_width: 2.0
