name: fastmeasure
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - pandas
  - matplotlib
  - pyyaml
  - tqdm
  - opencv
  - scikit-image  # REQUIRED for geometry.yaml filtering
  - scikit-learn
  - shapely
  - rasterio
  - networkx
  - rtree
  - pytorch>=2.3.0  # Supports NumPy 2.x
  - torchvision>=0.18.0
  - cpuonly  # Remove this line for GPU version
  - pip:
    - ultralytics
    - segment-anything
    - timm>=0.9.0  # Required by mobile_sam
